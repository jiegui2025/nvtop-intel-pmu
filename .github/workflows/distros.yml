name: distribution builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-consume:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: 'debian:12'
            setup: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates
          - image: 'ubuntu:24.04'
            setup: DEBIAN_FRONTEND=noninteractive apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential cmake ninja-build git ca-certificates
          - image: 'fedora:43'
            setup: dnf install -y gcc gcc-c++ cmake ninja-build git ca-certificates
          - image: 'archlinux:latest'
            setup: pacman -Sy --noconfirm --needed base-devel cmake ninja git ca-certificates
    steps:
      - name: Install build dependencies
        shell: bash
        run: ${{ matrix.setup }}
      - name: Show toolchain versions
        run: |
          cmake --version
          cc --version
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install package
        run: cmake --install build --prefix "$RUNNER_TEMP/intel-pmu-prefix"
      - name: Configure C-only package consumer
        run: >-
          cmake -S tests/package-consumer -B build/package-consumer -G Ninja
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/intel-pmu-prefix"
      - name: Build and run package consumer
        run: |
          cmake --build build/package-consumer --parallel
          ./build/package-consumer/intel_pmu_package_consumer
      - name: Configure C-only add_subdirectory consumer
        run: cmake -S tests/add-subdirectory-consumer -B build/add-subdirectory-consumer -G Ninja -DCMAKE_CXX_COMPILER=/nonexistent
      - name: Build and run add_subdirectory consumer
        run: |
          cmake --build build/add-subdirectory-consumer --parallel
          ./build/add-subdirectory-consumer/intel_pmu_add_subdirectory_consumer

  alpine-musl:
    name: 'alpine:3.22 (musl)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, install, and consume in Alpine
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/alpine-work"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/alpine-work:/work" \
            alpine:3.22 sh -eu -c '
              apk add --no-cache build-base cmake ninja ca-certificates linux-headers
              cmake --version
              cmake -S /src -B /work/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_DISABLE_FIND_PACKAGE_GTest=TRUE
              cmake --build /work/build --parallel
              ctest --test-dir /work/build --output-on-failure
              cmake --install /work/build --prefix /work/prefix
              cmake -S /src/tests/package-consumer -B /work/package-consumer -G Ninja -DCMAKE_PREFIX_PATH=/work/prefix
              cmake --build /work/package-consumer --parallel
              /work/package-consumer/intel_pmu_package_consumer
              cmake -S /src/tests/add-subdirectory-consumer -B /work/add-subdirectory-consumer -G Ninja -DCMAKE_CXX_COMPILER=/nonexistent
              cmake --build /work/add-subdirectory-consumer --parallel
              /work/add-subdirectory-consumer/intel_pmu_add_subdirectory_consumer
            '
